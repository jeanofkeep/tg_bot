name: Deploy to server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 4523
          script: |
            git config --global --add safe.directory /root/tg_bots/bot_taskss
            cd ~/tg_bots/bot_taskss
            git fetch --all
            git reset --hard origin/master
            docker compose down
            docker compose up --build -d
